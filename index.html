<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">

<!-- 建设银行小Logo（Favicon） -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%230d5eaf'/%3E%3Cpath d='M24 10.5 L34.5 16.2 H13.5 Z' fill='%23fff'/%3E%3Crect x='15.5' y='18.2' width='3.2' height='9.6' fill='%23fff'/%3E%3Crect x='22.4' y='18.2' width='3.2' height='9.6' fill='%23fff'/%3E%3Crect x='29.3' y='18.2' width='3.2' height='9.6' fill='%23fff'/%3E%3Crect x='13.5' y='29.6' width='21' height='3' fill='%23fff'/%3E%3Crect x='17' y='34.6' width='14' height='2.6' fill='%23fff'/%3E%3C/svg%3E">

<title>高代福 · 收款名片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #f2f3f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: #1a1a1a;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- 顶部导航栏 ---------- */
  .navbar {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #fff;
    border-bottom: 1px solid #ececec;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .navbar .title {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .navbar .close {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    cursor: pointer;
    color: #666;
  }
  .navbar .close svg { display: block; width: 100%; height: 100%; }

  /* ---------- 内容区 ---------- */
  .container {
    padding: 16px;
    flex: 1;
  }

  /* ---------- 名片卡片 ---------- */
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 8px 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.03);
    animation: fadeUp .35s ease both;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0;
    border-bottom: 1px solid #f0f0f0;
    gap: 12px;
  }
  .row:last-child { border-bottom: none; }

  .label {
    font-size: 16px;
    color: #1a1a1a;
    flex-shrink: 0;
    letter-spacing: .5px;
  }

  .value {
    font-size: 16px;
    color: #1a1a1a;
    text-align: right;
    font-weight: 500;
    word-break: break-all;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }

  .value .txt { line-height: 1.4; }

  /* 卡号样式 */
  .card-no {
    font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 17px;
    letter-spacing: .8px;
    font-weight: 600;
    color: #1a1a1a;
  }

  /* 复制小图标 */
  .copy-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    cursor: pointer;
    color: #8a8a8a;
    transition: color .2s;
  }
  .copy-icon:active { color: #0d5eaf; }
  .copy-icon svg { display: block; width: 100%; height: 100%; }

  /* 银行 logo */
  .bank-logo {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
  }
  .bank-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ---------- 按钮 ---------- */
  .btn {
    width: 100%;
    height: 48px;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .15s, transform .1s;
    margin-top: 16px;
    letter-spacing: .5px;
  }
  .btn:active { transform: scale(.985); opacity: .88; }

  .btn-primary {
    background: linear-gradient(135deg, #1268c3, #0d5eaf);
    color: #fff;
    box-shadow: 0 4px 14px rgba(13,94,175,.28);
  }

  .btn-outline {
    background: #fff;
    color: #0d5eaf;
    border: 1px solid #0d5eaf;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.9);
    background: rgba(0,0,0,.78);
    color: #fff;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
    z-index: 999;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 360px) {
    .label, .value { font-size: 15px; }
    .card-no { font-size: 15px; letter-spacing: .4px; }
  }
</style>
</head>
<body>

  <!-- 顶部栏 -->
  <div class="navbar">
    <div class="close" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
    <div class="title">高代福 · 收款名片</div>
  </div>

  <!-- 内容 -->
  <div class="container">

    <div class="card">

      <!-- 账户名称 -->
      <div class="row">
        <div class="label">收款户名</div>
        <div class="value">
          <span class="txt" id="acctName">高代福</span>
        </div>
      </div>

      <!-- 收款账号 -->
      <div class="row">
        <div class="label">收款账号</div>
        <div class="value">
          <span class="txt card-no" id="acctNo">6217 0037 6019 8190 928</span>
          <span class="copy-icon" onclick="copyText(document.getElementById('acctNo').textContent.replace(/\s/g,''), '账号已复制')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
            </svg>
          </span>
        </div>
      </div>

      <!-- 收款银行 -->
      <div class="row">
        <div class="label">收款银行</div>
        <div class="value">
          <span class="bank-wrap">
            <!-- 建设银行 Logo -->
            <svg class="bank-logo" viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="23" fill="#0d5eaf"/>
              <path d="M24 10.5 L34.5 16.2 H13.5 Z" fill="#fff"/>
              <rect x="15.5" y="18.2" width="3.2" height="9.6" fill="#fff"/>
              <rect x="22.4" y="18.2" width="3.2" height="9.6" fill="#fff"/>
              <rect x="29.3" y="18.2" width="3.2" height="9.6" fill="#fff"/>
              <rect x="13.5" y="29.6" width="21" height="3" fill="#fff"/>
              <rect x="17" y="34.6" width="14" height="2.6" fill="#fff"/>
            </svg>
            <span class="txt">建设银行</span>
          </span>
        </div>
      </div>

    </div>

    <!-- 主按钮：复制卡号 -->
    <button class="btn btn-primary" onclick="copyCardNo()">复制卡号</button>

    <!-- 次按钮：复制全部信息 -->
    <button class="btn btn-outline" onclick="copyAll()">复制全部收款信息</button>

  </div>

  <!-- 提示 -->
  <div class="toast" id="toast"></div>

<script>
  // 更新了这里的常量和展示内容
  const CARD_NO  = '6217003760198190928';      // 纯数字，不带空格
  const BANK     = '建设银行';
  const ACCT_NAME = '高代福';

  function copyCardNo() {
    copyText(CARD_NO, '卡号已复制');
  }

  function copyAll() {
    const text = `收款户名：${ACCT_NAME}\n收款账号：${CARD_NO}\n收款银行：${BANK}`;
    copyText(text, '收款信息已复制');
  }

  function copyText(text, successMsg) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text)
        .then(() => showToast(successMsg))
        .catch(() => fallbackCopy(text, successMsg));
    } else {
      fallbackCopy(text, successMsg);
    }
  }

  function fallbackCopy(text, successMsg) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    try {
      document.execCommand('copy');
      showToast(successMsg);
    } catch (e) {
      showToast('复制失败，请长按选择');
    }
    document.body.removeChild(ta);
  }

  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }
</script>
</body>
</html>
